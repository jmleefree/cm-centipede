# Overrides the image's baked-in default config (server/conf/cm-honeybee.yaml
# in the CM-Honeybee repo) so the "csp" source-group type can reach CB-Spider
# over the compose network instead of localhost.
#
# CM-Honeybee reads this file from /conf/cm-honeybee.yaml (see
# server/lib/config/cm-honeybee.go in the CM-Honeybee repo) — it does not
# support environment-variable overrides, so the spider username/password
# below must be kept in sync with SP_API_USERNAME / SP_API_PASSWORD in ../.env
# by hand if you change them from the "default"/"default" convention.
cm-honeybee:
    listen:
        port: 8081
    agent:
        port: 8082
    spider:
        endpoint: http://cb-spider:1024/spider
        username: default
        password: default
